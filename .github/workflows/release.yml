name: Build & Release Kotlin Multiplatform

on:
  repository_dispatch:
    types: [release-build]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branche ou SHA du dépôt candilog-kotlin à construire"
        required: false
        default: "dev"

permissions:
  contents: write

concurrency:
  group: release-kotlin
  cancel-in-progress: false

jobs:
  resolve:
    name: Résoudre la référence source
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Référence source
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ github.event.client_payload.sha }}"
          if [ -z "$ref" ]; then ref="${{ github.event.inputs.source_ref }}"; fi
          if [ -z "$ref" ]; then ref="dev"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  quality:
    name: Tests et qualité
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - name: Extraire candilog-kotlin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: &source-checkout
          repository: alexandrebouttierdev/candilog-kotlin
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.CANDILOG_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Installer Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: &java-setup
          distribution: temurin
          java-version: "21"
      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
      - name: Vérifier le portage
        run: ./gradlew check --warning-mode all

  build-linux:
    name: Paquets Linux (.deb + .rpm)
    runs-on: ubuntu-latest
    needs: [resolve, quality]
    steps:
      - name: Extraire candilog-kotlin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: *source-checkout
      - name: Installer Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: *java-setup
      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
      - name: Construire les paquets natifs
        run: ./gradlew packageDistributionForCurrentOS --warning-mode all
      - name: Normaliser les noms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for ext in deb rpm; do
            mapfile -t files < <(find build/compose/binaries/main -type f -name "*.$ext")
            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::Un paquet .$ext attendu, ${#files[@]} trouvé(s)"
              exit 1
            fi
            cp "${files[0]}" "dist/candilog-linux-latest.$ext"
          done
      - name: Publier l'artifact Linux
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Paquet macOS (.dmg)
    runs-on: macos-latest
    needs: [resolve, quality]
    steps:
      - name: Extraire candilog-kotlin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: *source-checkout
      - name: Installer Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: *java-setup
      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
      - name: Construire le paquet natif
        run: ./gradlew packageDistributionForCurrentOS --warning-mode all
      - name: Normaliser le nom
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          count=$(find build/compose/binaries/main -type f -name '*.dmg' | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "::error::Un paquet .dmg attendu, $count trouvé(s)"
            exit 1
          fi
          file=$(find build/compose/binaries/main -type f -name '*.dmg' -print -quit)
          cp "$file" dist/candilog-macos-latest.dmg
      - name: Publier l'artifact macOS
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Paquets Windows (.exe + .msi)
    runs-on: windows-latest
    needs: [resolve, quality]
    steps:
      - name: Extraire candilog-kotlin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: *source-checkout
      - name: Installer Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: *java-setup
      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
      - name: Construire les paquets natifs
        run: ./gradlew packageDistributionForCurrentOS --warning-mode all
      - name: Normaliser les noms
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($ext in @("exe", "msi")) {
            $files = @(Get-ChildItem build/compose/binaries/main -Recurse -File -Filter "*.$ext")
            if ($files.Count -ne 1) {
              Write-Error "Un paquet .$ext attendu, $($files.Count) trouvé(s)"
              exit 1
            }
            Copy-Item $files[0].FullName "dist/candilog-windows-latest.$ext"
          }
      - name: Publier l'artifact Windows
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: Signer et publier la release
    runs-on: ubuntu-latest
    needs: [resolve, quality, build-linux, build-macos, build-windows]
    steps:
      - name: Extraire candilog-kotlin pour la version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: *source-checkout
      - name: Télécharger les paquets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
      - name: Assembler et signer le manifeste
        shell: bash
        env:
          CANDILOG_RELEASE_SIGNING_KEY_B64: ${{ secrets.CANDILOG_RELEASE_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -1)
          if [ -z "$version" ]; then echo "::error::Version Kotlin introuvable"; exit 1; fi
          if [ -z "$CANDILOG_RELEASE_SIGNING_KEY_B64" ]; then echo "::error::Clé de signature absente"; exit 1; fi
          mkdir -p builds
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -exec cp {} builds/ \;
          for latest in builds/candilog-*-latest.*; do
            [ -f "$latest" ] || { echo "::error::Aucun paquet assemblé"; exit 1; }
            versioned="${latest/latest/$version}"
            cp "$latest" "$versioned"
          done
          (
            cd builds
            for package in candilog-*.*; do sha256sum "$package"; done | sort > candilog-checksums.txt
          )
          key_file="$RUNNER_TEMP/candilog-release-signing.pem"
          signature_file="$RUNNER_TEMP/candilog-checksums.signature"
          trap 'rm -f "$key_file" "$signature_file"' EXIT
          printf '%s' "$CANDILOG_RELEASE_SIGNING_KEY_B64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          openssl pkeyutl -sign -rawin -inkey "$key_file" -in builds/candilog-checksums.txt -out "$signature_file"
          base64 --wrap=0 "$signature_file" > builds/candilog-checksums.txt.sig
          printf '\n' >> builds/candilog-checksums.txt.sig
          rm -f "$key_file" "$signature_file"
          trap - EXIT
          echo "version=$version" >> "$GITHUB_ENV"
          ls -la builds
      - name: Publier la release versionnée
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::La release $tag existe déjà"
            exit 1
          fi
          gh release create "$tag" builds/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Candilog ${version}" \
            --notes "Paquets Kotlin Multiplatform signés de Candilog ${version}."
